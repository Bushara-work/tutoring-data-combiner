<style>
    :root {
        --primary: #2563eb; --primary-hover: #1d4ed8; --danger: #dc2626;
        --danger-hover: #b91c1c; --success: #16a34a; --gray-100: #f3f4f6;
        --gray-200: #e5e7eb; --gray-300: #d1d5db; --gray-700: #374151;
        --amber-500: #f59e0b; --amber-100: #fef3c7;
    }
    body { font-family: sans-serif; margin: 2rem; background-color: #fafafa; color: var(--gray-700); }
    .container { max-width: 1400px; margin: 0 auto; }
    .stage { display: none; } .stage.active { display: block; }
    
    /* Upload Zone */
    .upload-section {
        border: 2px dashed var(--gray-300); padding: 3rem;
        border-radius: 12px; text-align: center; background: white;
        cursor: pointer; transition: all 0.2s;
    }
    .upload-section.drag-over { border-color: var(--primary); background: #eff6ff; }

    /* Tables */
    .table-container { 
        overflow: auto; background: white; border-radius: 8px; 
        border: 1px solid var(--gray-300); margin-top: 1rem; max-height: 70vh;
    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--gray-200); padding: 0.5rem; font-size: 0.875rem; white-space: nowrap; }
    .excel-row-header { background: var(--gray-100); font-weight: bold; text-align: center; }

    /* Duplicate Highlighting & Approval */
    tr.duplicate-highlight td { background-color: var(--amber-100) !important; }
    tr.approved-row td { background-color: white !important; opacity: 0.8; }
    .btn-approve { 
        background: var(--success); color: white; border: none; 
        border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 10px;
    }

    /* Drag Ghosting */
    .drag-ghost {
        position: fixed; top: -1000px; background: white;
        border: 2px solid var(--primary); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        z-index: 9999; pointer-events: none; opacity: 0.9;
    }
    .ghost-head { background: var(--primary); color: white; padding: 8px; font-weight: bold; }
    .ghost-body { padding: 8px; font-size: 12px; color: #666; }

    /* Original Components */
    .btn { padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .filter-panel { background: white; border: 1px solid var(--gray-300); padding: 1rem; border-radius: 6px; margin-top: 1rem; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .context-menu { position: fixed; background: white; border: 1px solid #ccc; display: none; z-index: 1000; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
    .context-item { padding: 8px 12px; cursor: pointer; } .context-item:hover { background: #eee; }
</style>

<div class="container">
    <h2>CSV Attendance Merger & Editor</h2>

    <!-- STAGE 1: UPLOAD -->
    <div id="stage-1" class="stage active">
        <div class="upload-section" id="drop-zone">
            <input type="file" id="csv-picker" multiple accept=".csv" style="display: none;">
            <p><strong>Drag & Drop files here</strong> or click to select</p>
            <button class="btn btn-primary" onclick="document.getElementById('csv-picker').click()">Browse Files</button>
        </div>
        <div id="file-queue" style="margin: 1rem 0;"></div>
        <button class="btn btn-success" id="process-btn">Combine & Process Data</button>
    </div>

    <!-- STAGE 2: EDITOR -->
    <div id="stage-2" class="stage">
        <div class="header-controls" style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn btn-primary" id="back-btn">← Back</button>
            <button class="btn btn-success" id="download-btn">Download Master File</button>
            <button class="btn btn-primary" id="toggle-reorder-btn">Toggle Reorder Mode</button>
            <button class="btn btn-danger" id="scan-duplicates-btn">Find & Resolve Duplicates</button>
            <button class="btn btn-primary" id="reset-approvals-btn">Reset Scan/Approvals ↺</button>
        </div>

        <!-- Filters (Your Original Logic) -->
        <div class="filter-panel">
            <div class="filter-grid">
                <input type="text" id="filter-name" placeholder="Filter Name">
                <input type="text" id="filter-code" placeholder="Filter Meeting Code">
                <input type="number" id="filter-dur-min" placeholder="Min Duration">
                <input type="text" id="filter-date-start" placeholder="Start Date">
                <input type="text" id="filter-date-end" placeholder="End Date">
                <button class="btn btn-danger" id="reset-filters-btn">Reset Filters</button>
            </div>
        </div>

        <div class="table-container">
            <table id="master-table">
                <thead>
                    <tr id="table-header-letters"></tr>
                    <tr id="table-headers"></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Context Menus -->
<div id="col-ctx" class="context-menu">
    <div class="context-item" id="ctx-del-col">Delete Column</div>
</div>

<script>
let MASTER_HEADERS = ["SNo", "Participant Name", "Attendance Started at", "Joined at(beta)", "Attendance Stopped at", "Attended Duration", "Meeting code", "Class Date"];
let masterData = []; // Each row: { data: {}, isDuplicate: bool, isApproved: bool }
let uploadedFiles = [];
let isReorderMode = false;

// --- FILE INPUT & DRAG DROP ---
const dropZone = document.getElementById('drop-zone');
const csvPicker = document.getElementById('csv-picker');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
    dropZone.addEventListener(e, (ev) => { ev.preventDefault(); ev.stopPropagation(); });
});

dropZone.addEventListener('dragover', () => dropZone.classList.add('drag-over'));
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
    dropZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
});
csvPicker.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(files) {
    for (let f of files) { if (f.name.endsWith('.csv')) uploadedFiles.push(f); }
    renderQueue();
}

function renderQueue() {
    document.getElementById('file-queue').innerHTML = uploadedFiles.map((f, i) => 
        `<div style="background:#fff; padding:5px; border:1px solid #ddd; margin-bottom:2px;">${f.name}</div>`).join('');
}

// --- CSV PROCESSING ---
document.getElementById('process-btn').addEventListener('click', async () => {
    if (!uploadedFiles.length) return alert("Pick files!");
    masterData = [];
    for (let file of uploadedFiles) {
        const text = await file.text();
        const lines = text.split('\n').filter(l => l.trim());
        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, '').toLowerCase());
        
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim().replace(/"/g, ''));
            let rowObj = { data: {}, isDuplicate: false, isApproved: false };
            MASTER_HEADERS.forEach(h => {
                const idx = headers.indexOf(h.toLowerCase());
                rowObj.data[h] = idx > -1 ? values[idx] : "";
            });
            // Auto-detect date from filename if missing
            if (!rowObj.data["Class Date"]) rowObj.data["Class Date"] = file.name;
            masterData.push(rowObj);
        }
    }
    renderMasterTableUI();
    document.getElementById('stage-1').classList.remove('active');
    document.getElementById('stage-2').classList.add('active');
});

// --- DUPLICATE SYSTEM ---
document.getElementById('scan-duplicates-btn').addEventListener('click', () => {
    const map = new Map();
    masterData.forEach((row, idx) => {
        const fingerprint = JSON.stringify(row.data);
        if (!map.has(fingerprint)) map.set(fingerprint, []);
        map.get(fingerprint).push(idx);
    });
    
    map.forEach(indices => {
        if (indices.length > 1) {
            indices.forEach(i => masterData[i].isDuplicate = true);
        }
    });
    renderMasterTableUI();
});

document.getElementById('reset-approvals-btn').addEventListener('click', () => {
    masterData.forEach(r => { r.isDuplicate = false; r.isApproved = false; });
    renderMasterTableUI();
});

// --- DRAG GHOSTING LOGIC ---
function createGhost(label, subtext) {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    g.innerHTML = `<div class="ghost-head">${label}</div><div class="ghost-body">${subtext}</div>`;
    document.body.appendChild(g);
    return g;
}

// --- UI RENDERING ---
function renderMasterTableUI() {
    const theadL = document.getElementById('table-header-letters');
    const theadH = document.getElementById('table-headers');
    const tbody = document.getElementById('table-body');
    
    theadL.innerHTML = '<th>#</th>';
    theadH.innerHTML = '<th>Idx</th>';

    MASTER_HEADERS.forEach((h, i) => {
        const thL = document.createElement('th');
        thL.textContent = String.fromCharCode(65 + i);
        thL.className = 'excel-row-header';
        if (isReorderMode) {
            thL.draggable = true;
            thL.onsubmit = e => e.preventDefault();
            thL.ondragstart = (e) => {
                e.dataTransfer.setData('col', i);
                const ghost = createGhost(`Moving Column: ${h}`, `Data type: CSV Column`);
                e.dataTransfer.setDragImage(ghost, 0, 0);
                setTimeout(() => ghost.remove(), 1);
            };
        }
        theadL.appendChild(thL);
        const thH = document.createElement('th');
        thH.textContent = h;
        theadH.appendChild(thH);
    });

    tbody.innerHTML = '';
    masterData.forEach((row, idx) => {
        const tr = document.createElement('tr');
        if (row.isDuplicate && !row.isApproved) tr.className = 'duplicate-highlight';
        if (row.isApproved) tr.className = 'approved-row';
        
        if (isReorderMode) {
            tr.draggable = true;
            tr.ondragstart = (e) => {
                e.dataTransfer.setData('row', idx);
                const ghost = createGhost(`Moving Row ${idx+1}`, row.data["Participant Name"] || "Unknown");
                e.dataTransfer.setDragImage(ghost, 0, 0);
                setTimeout(() => ghost.remove(), 1);
            };
        }

        // Action Cell (Approval)
        const tdIdx = document.createElement('td');
        tdIdx.className = 'excel-row-header';
        tdIdx.innerHTML = `<span>${idx+1}</span>`;
        if (row.isDuplicate && !row.isApproved) {
            const btn = document.createElement('button');
            btn.className = 'btn-approve';
            btn.textContent = '✓';
            btn.onclick = () => { row.isApproved = true; renderMasterTableUI(); };
            tdIdx.appendChild(btn);
        }
        tr.appendChild(tdIdx);

        MASTER_HEADERS.forEach(h => {
            const td = document.createElement('td');
            const input = document.createElement('input');
            input.value = row.data[h];
            input.style.border = 'none'; input.style.width = '100%';
            input.onchange = (e) => row.data[h] = e.target.value;
            td.appendChild(input);
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

// --- DRAG DROP TABLE HANDLING ---
document.getElementById('master-table').ondragover = e => e.preventDefault();
document.getElementById('master-table').ondrop = e => {
    const colIdx = e.dataTransfer.getData('col');
    const rowIdx = e.dataTransfer.getData('row');
    const target = e.target.closest('td, th');
    if (!target) return;

    if (colIdx !== "") {
        const newIdx = target.cellIndex - 1;
        const item = MASTER_HEADERS.splice(colIdx, 1)[0];
        MASTER_HEADERS.splice(newIdx, 0, item);
    }
    if (rowIdx !== "") {
        const newIdx = target.parentElement.rowIndex - 2;
        const item = masterData.splice(rowIdx, 1)[0];
        masterData.splice(newIdx, 0, item);
    }
    renderMasterTableUI();
};

document.getElementById('toggle-reorder-btn').onclick = () => {
    isReorderMode = !isReorderMode;
    renderMasterTableUI();
};

document.getElementById('download-btn').onclick = () => {
    let csv = MASTER_HEADERS.join(',') + '\n';
    masterData.forEach(r => {
        csv += MASTER_HEADERS.map(h => `"${r.data[h]}"`).join(',') + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'master_attendance.csv'; a.click();
};

document.getElementById('back-btn').onclick = () => {
    document.getElementById('stage-2').classList.remove('active');
    document.getElementById('stage-1').classList.add('active');
};
</script>

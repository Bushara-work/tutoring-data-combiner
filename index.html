<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Attendance Merger</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-700: #374151;
            --excel-green: #107c41;
            --excel-green-hover: #0b5931;
            --warning-light: #fffbeb;
            --warning-border: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 2rem;
            color: var(--gray-700);
            background-color: #fafafa;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .stage {
            display: none;
        }
        .stage.active {
            display: block;
        }
        .upload-section {
            border: 2px dashed var(--gray-300);
            padding: 3rem;
            border-radius: 8px;
            text-align: center;
            background: white;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }
        .upload-section:hover, .upload-section.dragover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            max-width: 600px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--gray-300);
        }
        .file-name {
            font-size: 0.95rem;
            font-weight: 500;
        }
        .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: bold;
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0 0.5rem;
        }
        .remove-btn:hover {
            color: var(--danger-hover);
        }
        
        .stage-2-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .header-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-row-2 {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .sort-controls {
            background: #ffffff;
            border: 1px solid var(--gray-300);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            display: flex;
            gap: 1rem;
            align-items: center;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sort-controls select {
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--gray-300);
            background-color: #fff;
            color: var(--gray-700);
            font-weight: 500;
        }
        .sort-controls select:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }
        
        .switch-btn {
            padding: 0.4rem 0.8rem;
            background: var(--gray-100);
            border: 1px solid var(--gray-300);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray-700);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }
        .switch-btn:hover:not(:disabled) {
            background: #e5e7eb;
        }
        .switch-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .btn-toggle-time {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            background: white;
            border: 1px solid var(--gray-300);
            border-radius: 4px;
            color: var(--gray-700);
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-toggle-time:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .btn-excel-tool {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--excel-green);
            border: 1px solid var(--excel-green);
            border-radius: 4px;
            color: white;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background 0.2s;
        }
        .btn-excel-tool:hover:not(:disabled) { background: var(--excel-green-hover); }
        .btn-excel-tool:disabled { opacity: 0.5; cursor: not-allowed; }

        .filter-panel {
            background: #ffffff;
            border: 1px solid var(--gray-300);
            padding: 1.25rem;
            border-radius: 6px;
            margin-top: 1rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .filter-header-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: bold;
            color: var(--gray-700);
            width: 100%;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-top: 0.75rem;
        }
        .filter-box {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .filter-box label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--gray-700);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .filter-input {
            padding: 0.45rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--gray-300);
            font-size: 0.875rem;
            width: 100%;
            box-sizing: border-box;
        }
        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .range-inputs {
            display: flex;
            gap: 0.5rem;
        }
        .range-inputs input {
            width: 50%;
        }
        .toggle-link {
            font-size: 0.75rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            user-select: none;
            font-weight: normal;
        }
        button.btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }

        .duplicate-row-indicator {
            background-color: var(--warning-light) !important;
            border-bottom: 2px dashed var(--warning-border) !important;
            position: relative;
        }
        .duplicate-row-indicator td {
            border-bottom: 2px dashed var(--warning-border) !important;
        }
        .audit-badge {
            background: #f59e0b;
            color: white;
            font-size: 0.75rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: bold;
        }
        .audit-action-btn {
            padding: 0.2rem 0.4rem;
            font-size: 0.75rem;
            background: white;
            border: 1px solid var(--gray-300);
            border-radius: 3px;
            cursor: pointer;
            color: var(--gray-700);
        }
        .audit-action-btn:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }

        .table-container {
            margin-top: 1.5rem;
            overflow-x: auto;
            background: white;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
        }
        th {
            background: var(--gray-100);
            font-weight: 600;
        }
        .excel-row-header {
            background: var(--gray-100);
            text-align: center;
            font-weight: bold;
            color: #6b7280;
            user-select: none;
        }
        .cell-editable {
            outline: none;
        }
        .cell-editable:focus {
            background: #eff6ff;
            box-shadow: inset 0 0 0 2px var(--primary);
        }
        
        .draggable-header {
            cursor: grab;
            transition: box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .draggable-header:active {
            cursor: grabbing;
        }
        .draggable-header.drag-over-active {
            box-shadow: inset 0 0 0 2px var(--primary) !important;
            background-color: #eff6ff !important;
        }
        
        .lock-container {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: 1px solid var(--gray-300);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lock-container.is-locked { background: #fee2e2; border-color: var(--danger); }
        
        .css-arrow-icon {
            display: inline-block;
            width: 0; height: 0;
            margin-left: 0.5rem;
            vertical-align: middle;
            cursor: pointer;
        }
        .arrow-up { border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 5px solid var(--gray-700); }
        .arrow-down { border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 5px solid var(--gray-700); }
        .is-disabled { opacity: 0.3; cursor: not-allowed; }

        .excel-context-menu {
            position: absolute;
            background: white;
            border: 1px solid var(--gray-300);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border-radius: 4px;
            display: none;
            z-index: 1000;
            padding: 0.25rem 0;
        }
        .context-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .context-item:hover { background: var(--gray-100); }
        .item-danger { color: var(--danger); }
        .item-danger:hover { background: #fee2e2; }
        .context-menu-mask {
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            z-index: 999; display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="stage-1" class="stage active">
        <h2>Upload Attendance CSV Files</h2>
        <div class="upload-section" id="drop-zone">
            <p>Drag & Drop your CSV logs here or <b>Browse Files</b></p>
            <input type="file" id="csv-picker" multiple accept=".csv" style="display: none;">
        </div>
        <div class="file-list" id="file-queue"></div>
        <button class="btn btn-primary" id="next-btn">Process & Merge Records</button>
    </div>

    <div id="stage-2" class="stage">
        <div class="stage-2-header">
            <div class="header-row-1">
                <button class="btn btn-danger" id="back-btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">← Back</button>
                <h2>Merged File View <span id="audit-summary-pill" style="display:none; font-size: 0.9rem; padding: 0.25rem 0.5rem; border-radius: 20px; background: #f59e0b; color: white; margin-left: 10px;"></span></h2>
                <button class="btn btn-primary" id="download-btn" style="background: var(--excel-green);">Export</button>
            </div>
            
            <div class="header-row-2">
                <div class="sort-controls">
                    <div class="control-group">
                        <button id="priority-switch-btn" class="switch-btn">
                            <span style="font-size: 1.1rem; font-weight: bold; color: var(--primary);">⇅</span>
                            <span>Name Priority First</span>
                        </button>
                    </div>
                    
                    <div class="control-group">
                        <label for="name-sort-rule"><b>Name Order:</b></label>
                        <select id="name-sort-rule">
                            <option value="asc" selected>A → Z</option>
                            <option value="desc">Z → A</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="date-sort-rule"><b>Date Order:</b></label>
                        <select id="date-sort-rule">
                            <option value="desc" selected>Newest → Oldest</option>
                            <option value="asc">Oldest → Newest</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <button id="rank-lock-btn" class="lock-container is-unlocked" title="Lock Sort Configuration Layouts"></button>
                    </div>
                </div>
                
                <button id="time-convert-btn" class="btn-toggle-time">Time Format (12h ⇄ 24h)</button>
                <button id="toggle-reorder-btn" class="btn-excel-tool">Enable Drag Reorder Mode</button>
            </div>
        </div>

        <div class="filter-panel">
            <div class="filter-header-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; color: #4b5563; margin-right: 4px;">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
                <span>Condition Filters</span>
            </div>
            <div class="filter-grid">
                <div class="filter-box">
                    <label>Participant Name</label>
                    <input type="text" id="filter-name" class="filter-input" placeholder="Search name...">
                </div>
                <div class="filter-box">
                    <label>Attendance Started At</label>
                    <input type="text" id="filter-started-time" class="filter-input" placeholder="Search join time...">
                </div>
                <div class="filter-box">
                    <label>Joined At (beta)</label>
                    <input type="text" id="filter-joined-time" class="filter-input" placeholder="Search beta timestamp...">
                </div>
                <div class="filter-box">
                    <label>Attendance Stopped At</label>
                    <input type="text" id="filter-stopped-time" class="filter-input" placeholder="Search leave time...">
                </div>
                <div class="filter-box">
                    <label>Meeting Code</label>
                    <input type="text" id="filter-code" class="filter-input" placeholder="Search code...">
                </div>
                <div class="filter-box">
                    <label>
                        Class Date
                        <span id="start-date-toggle" class="toggle-link">Inc</span>
                        <span id="end-date-toggle" class="toggle-link">Inc</span>
                    </label>
                    <div class="range-inputs">
                        <input type="text" id="filter-date-start" class="filter-input" placeholder="Start Bounds">
                        <input type="text" id="filter-date-end" class="filter-input" placeholder="End Bounds">
                    </div>
                </div>
                <div class="filter-box" style="justify-content: flex-end; flex-direction: row; gap: 0.5rem; grid-column: span 1;">
                    <button id="re-audit-btn" class="btn-excel-tool" style="background: #db2777; border-color: #db2777; width: 50%; height: 38px;">Audit Overlaps 🔍</button>
                    <button class="btn btn-danger" id="reset-filters-btn" style="padding: 0.4rem 1rem; font-size: 0.85rem; width: 50%; height: 38px;">Reset Filters ↺</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="master-table">
                <thead>
                    <tr id="table-header-letters"></tr>
                    <tr id="table-headers"></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="context-mask" class="context-menu-mask"></div>
<div id="column-context-menu" class="excel-context-menu">
    <div class="context-item" id="ctx-insert-col-left">
        <span style="font-weight: bold; color: var(--primary);">+</span>
        <span>Insert Column Left</span>
    </div>
    <div class="context-item item-danger" id="ctx-delete-col">
        <span style="font-weight: bold;">✕</span>
        <span>Delete Column</span>
    </div>
</div>
<div id="row-context-menu" class="excel-context-menu">
    <div class="context-item" id="ctx-insert-row-above">
        <span style="font-weight: bold; color: var(--primary);">+</span>
        <span>Insert Row Above</span>
    </div>
    <div class="context-item item-danger" id="ctx-delete-row">
        <span style="font-weight: bold;">✕</span>
        <span>Delete Row</span>
    </div>
</div>

<script>
    let MASTER_HEADERS = [
        "SNo", "Participant Name", "Attendance Started at", 
        "Joined at(beta)", "Attendance Stopped at", "Meeting code", "Class Date"
    ];
    const SYSTEM_PROTECTED_HEADERS = [...MASTER_HEADERS];
    
    let uploadedFilesArray = [];
    let masterData = [];
    let ignoredAuditHashes = new Set();
    let isRankLocked = false;
    let isNamePriorityPrimary = true;
    let isStartDateInclusive = true;
    let isEndDateInclusive = true;
    let use24HourFormat = true;
    
    let isDragReorderModeActive = false;
    let draggedColumnHeaderIndex = null;
    let activeContextColumnHeaderKey = null;
    let activeContextRowDataIndex = null;

    const csvPicker = document.getElementById('csv-picker');
    const dropZone = document.getElementById('drop-zone');
    const fileQueue = document.getElementById('file-queue');
    const nextBtn = document.getElementById('next-btn');
    const backBtn = document.getElementById('back-btn');
    const downloadBtn = document.getElementById('download-btn');
    const timeConvertBtn = document.getElementById('time-convert-btn');
    const resetFiltersBtn = document.getElementById('reset-filters-btn');
    const toggleReorderBtn = document.getElementById('toggle-reorder-btn');
    const reAuditBtn = document.getElementById('re-audit-btn');
    
    const nameSortRule = document.getElementById('name-sort-rule');
    const dateSortRule = document.getElementById('date-sort-rule');
    const prioritySwitchBtn = document.getElementById('priority-switch-btn');
    const rankLockBtn = document.getElementById('rank-lock-btn');
    
    const filterName = document.getElementById('filter-name');
    const filterCode = document.getElementById('filter-code');
    const filterDateStart = document.getElementById('filter-date-start');
    const filterDateEnd = document.getElementById('filter-date-end');
    const startDateToggle = document.getElementById('start-date-toggle');
    const endDateToggle = document.getElementById('end-date-toggle');
    
    const filterStartedTime = document.getElementById('filter-started-time');
    const filterJoinedTime = document.getElementById('filter-joined-time');
    const filterStoppedTime = document.getElementById('filter-stopped-time');
    
    const stage1 = document.getElementById('stage-1');
    const stage2 = document.getElementById('stage-2');
    
    const tableHeaders = document.getElementById('table-headers');
    const tableHeaderLetters = document.getElementById('table-header-letters');
    const tableBody = document.getElementById('table-body');
    
    const contextMask = document.getElementById('context-mask');
    const columnContextMenu = document.getElementById('column-context-menu');
    const rowContextMenu = document.getElementById('row-context-menu');

    dropZone.addEventListener('click', () => csvPicker.click());
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files) {
            handleFileSelection(e.dataTransfer.files);
        }
    });

    csvPicker.addEventListener('change', (e) => {
        if (e.target && e.target.files) {
            handleFileSelection(e.target.files);
        }
    });

    function handleFileSelection(files) {
        if (!files) return;
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.name.toLowerCase().endsWith('.csv')) {
                if (!uploadedFilesArray.some(f => f.name === file.name)) {
                    uploadedFilesArray.push(file);
                }
            }
        }
        renderFileQueueUI();
    }

    function renderFileQueueUI() {
        fileQueue.innerHTML = '';
        uploadedFilesArray.forEach((file, index) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <span class="file-name">${file.name}</span>
                <button class="remove-btn" onclick="removeFileFromQueue(${index})">✕</button>
            `;
            fileQueue.appendChild(div);
        });
    }

    window.removeFileFromQueue = function(index) {
        uploadedFilesArray.splice(index, 1);
        renderFileQueueUI();
    };

    function generateRowFingerprint(row) {
        const name = (row["Participant Name"] || "").trim().toLowerCase();
        const code = (row["Meeting code"] || "").trim().toLowerCase();
        const date = (row["Class Date"] || "").trim().toLowerCase();
        const start = (row["Attendance Started at"] || "").trim().toLowerCase();
        const end = (row["Attendance Stopped at"] || "").trim().toLowerCase();
        return `${name}|${code}|${date}|${start}|${end}`;
    }

    function runAuditEngine() {
        const counts = {};
        masterData.forEach((row) => {
            const hash = generateRowFingerprint(row);
            counts[hash] = (counts[hash] || 0) + 1;
        });

        let overlapCount = 0;
        masterData.forEach((row) => {
            const hash = generateRowFingerprint(row);
            if (counts[hash] > 1 && !ignoredAuditHashes.has(hash)) {
                row._isDuplicateOverlap = true;
                overlapCount++;
            } else {
                row._isDuplicateOverlap = false;
            }
        });

        const pill = document.getElementById('audit-summary-pill');
        if (overlapCount > 0) {
            pill.textContent = `${overlapCount} Alerts`;
            pill.style.display = 'inline-block';
        } else {
            pill.style.display = 'none';
        }
    }

    function parseCustomDate(str) {
        if (!str) return new Date(0);
        const d = new Date(str);
        return isNaN(d.getTime()) ? new Date(0) : d;
    }

    nextBtn.addEventListener('click', () => {
        if (uploadedFilesArray.length === 0) {
            alert('Please select at least one CSV file.');
            return;
        }

        let filesRead = 0;
        masterData = [];
        ignoredAuditHashes.clear();

        uploadedFilesArray.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = parseCSVToObjects(text);
                masterData = masterData.concat(rows);
                filesRead++;
                if (filesRead === uploadedFilesArray.length) {
                    normalizeAndInitializeData();
                }
            };
            reader.readAsText(file);
        });
    });

    function parseCSVToObjects(text) {
        const lines = text.split(/\r?\n/);
        if (lines.length === 0) return [];
        
        let headerIndex = -1;
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line && !line.replace(/,/g, '').trim()) continue; 
            if (line.toLowerCase().includes("participant name") || line.toLowerCase().includes("meeting code")) {
                headerIndex = i;
                break;
            }
        }
        if (headerIndex === -1) headerIndex = 0;

        const headers = lines[headerIndex].split(',').map(h => h.replace(/^"|"$/g, '').trim());
        const result = [];
        
        for (let i = headerIndex + 1; i < lines.length; i++) {
            const rowLine = lines[i].trim();

                const td = document.createElement('td');
                
                if (headerKey === "Participant Name" && row._isDuplicateOverlap) {
                    td.innerHTML = `<span>${row[headerKey] || ""}</span><span class="audit-badge" title="Exact overlap matrix match found">⚠️ alert</span>`;
                    
                    const actionBtn = document.createElement('button');
                    actionBtn.className = 'audit-action-btn';
                    actionBtn.style.marginLeft = '10px';
                    actionBtn.textContent = 'Ignore';
                    actionBtn.onclick = (e) => {
                        e.stopPropagation();
                        const currentHash = generateRowFingerprint(row);
                        ignoredAuditHashes.add(currentHash);
                        runAuditEngine();
                        renderMasterTableUI();
                    };
                    td.appendChild(actionBtn);
                } else {
                    td.textContent = row[headerKey] || "";
                }

                if (!SYSTEM_PROTECTED_HEADERS.includes(headerKey) || headerKey === "Participant Name" || headerKey === "Meeting code" || headerKey === "Class Date") {
                    td.contentEditable = "true";
                    td.className = "cell-editable";
                    td.addEventListener('blur', () => {
                        row[headerKey] = td.innerText.replace('⚠️ alertIgnore', '').trim();
                        runAuditEngine();
                        renderMasterTableUI();
                    });
                }
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }

    reAuditBtn.addEventListener('click', () => {
        ignoredAuditHashes.clear();
        runAuditEngine();
        renderMasterTableUI();
    });

    [filterName, filterCode, filterDateStart, filterDateEnd, filterStartedTime, filterJoinedTime, filterStoppedTime].forEach(el => {
        el.addEventListener('input', renderMasterTableUI);
    });

    nameSortRule.addEventListener('change', () => { sortMasterData(); renderMasterTableUI(); });
    dateSortRule.addEventListener('change', () => { sortMasterData(); renderMasterTableUI(); });

    startDateToggle.addEventListener('click', () => {
        isStartDateInclusive = !isStartDateInclusive;
        startDateToggle.textContent = isStartDateInclusive ? "Inc" : "Exc";
        renderMasterTableUI();
    });
    endDateToggle.addEventListener('click', () => {
        isEndDateInclusive = !isEndDateInclusive;
        endDateToggle.textContent = isEndDateInclusive ? "Inc" : "Exc";
        renderMasterTableUI();
    });

    timeConvertBtn.addEventListener('click', () => {
        use24HourFormat = !use24HourFormat;
        masterData.forEach((row) => {
            const hash = generateRowFingerprint(row);
            counts[hash] = (counts[hash] || 0) + 1;
        });

        let overlapCount = 0;
        masterData.forEach((row) => {
            const hash = generateRowFingerprint(row);
            if (counts[hash] > 1 && !ignoredAuditHashes.has(hash)) {
                row._isDuplicateOverlap = true;
                overlapCount++;
            } else {
                row._isDuplicateOverlap = false;
            }
        });

        const pill = document.getElementById('audit-summary-pill');
        if (overlapCount > 0) {
            pill.textContent = `${overlapCount} Alerts`;
            pill.style.display = 'inline-block';
        } else {
            pill.style.display = 'none';
        }
    }

    function parseCustomDate(str) {
        if (!str) return new Date(0);
        const d = new Date(str);
        return isNaN(d.getTime()) ? new Date(0) : d;
    }

    nextBtn.addEventListener('click', () => {
        if (uploadedFilesArray.length === 0) {
            alert('Please select at least one CSV file.');
            return;
        }

        let filesRead = 0;
        masterData = [];
        ignoredAuditHashes.clear();

        uploadedFilesArray.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = parseCSVToObjects(text);
                masterData = masterData.concat(rows);
                filesRead++;
                if (filesRead === uploadedFilesArray.length) {
                    normalizeAndInitializeData();
                }
            };
            reader.readAsText(file);
        });
    });

    function parseCSVToObjects(text) {
        const lines = text.split(/\r?\n/);
        if (lines.length === 0) return [];
        
        let headerIndex = -1;
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line && !line.replace(/,/g, '').trim()) continue; 
            if (line.toLowerCase().includes("participant name") || line.toLowerCase().includes("meeting code")) {
                headerIndex = i;
                break;
            }
        }
        if (headerIndex === -1) headerIndex = 0;

        const headers = lines[headerIndex].split(',').map(h => h.replace(/^"|"$/g, '').trim());
        const result = [];
        
        for (let i = headerIndex + 1; i < lines.length; i++) {
            const rowLine = lines[i].trim();
            if (!rowLine || !rowLine.replace(/,/g, '').trim()) continue; 
            const values = parseCSVLine(lines[i]);
            const obj = {};
            headers.forEach((h, idx) => {
                if (h) obj[h] = values[idx] !== undefined ? values[idx] : "";
            });
            result.push(obj);
        }
        return result;
    }

    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim());
        return result.map(v => v.replace(/^"|"$/g, ''));
    }
    function normalizeAndInitializeData() {
        masterData.forEach((row, index) => {
            row["SNo"] = String(index + 1);
            if (!row["Class Date"] && row["Attendance Started at"]) {
                const parts = row["Attendance Started at"].split(' ');
                if (parts && parts[0]) row["Class Date"] = parts[0];
            }
        });
        sortMasterData();
        runAuditEngine();
        stage1.classList.remove('active');
        stage2.classList.add('active');
        renderMasterTableUI();
    }

    backBtn.addEventListener('click', () => {
        stage2.classList.remove('active');
        stage1.classList.add('active');
    });

    prioritySwitchBtn.addEventListener('click', () => {
        if (isRankLocked) return;
        isNamePriorityPrimary = !isNamePriorityPrimary;
        prioritySwitchBtn.querySelector('span:nth-child(2)').textContent = isNamePriorityPrimary ? "Name Priority First" : "Date Priority First";
        sortMasterData();
        renderMasterTableUI();
    });

    rankLockBtn.addEventListener('click', () => {
        isRankLocked = !isRankLocked;
        if (isRankLocked) {
            rankLockBtn.className = "lock-container is-locked";
            nameSortRule.disabled = true;
            dateSortRule.disabled = true;
            prioritySwitchBtn.disabled = true;
            toggleReorderBtn.disabled = true;
            isDragReorderModeActive = false;
            toggleReorderBtn.textContent = "Enable Drag Reorder Mode";
        } else {
            rankLockBtn.className = "lock-container is-unlocked";
            nameSortRule.disabled = false;
            dateSortRule.disabled = false;
            prioritySwitchBtn.disabled = false;
            toggleReorderBtn.disabled = false;
        }
        renderMasterTableUI();
    });

    function sortMasterData() {
        const nameDirection = nameSortRule.value === 'asc' ? 1 : -1;
        const dateDirection = dateSortRule.value === 'asc' ? 1 : -1;

        function checkNameLayer(a, b) {
            const nameA = (a["Participant Name"] || "").toLowerCase();
            const nameB = (b["Participant Name"] || "").toLowerCase();
            return nameA.localeCompare(nameB) * nameDirection;
        }

        function checkDateLayer(a, b) {
            const dateA = parseCustomDate(a["Class Date"]);
            const dateB = parseCustomDate(b["Class Date"]);
            return (dateA - dateB) * dateDirection;
        }

        masterData.sort((a, b) => {
            if (isNamePriorityPrimary) {
                const res = checkNameLayer(a, b);
                if (res !== 0) return res;
                return checkDateLayer(a, b);
            } else {
                const res = checkDateLayer(a, b);
                if (res !== 0) return res;
                return checkNameLayer(a, b);
            }
        });
    }
    function flipDirectionOnly(columnKey) {
        if (isRankLocked) return;
        if (columnKey === "Participant Name") {
            nameSortRule.value = (nameSortRule.value === 'asc') ? 'desc' : 'asc';
        } else if (columnKey === "Class Date") {
            dateSortRule.value = (dateSortRule.value === 'asc') ? 'desc' : 'asc';
        }
        sortMasterData();
        renderMasterTableUI();
    }

    function setPrimaryRankFromHeaderClick(columnKey) {
        if (isRankLocked || isDragReorderModeActive) return;
        if (columnKey === "Participant Name" && !isNamePriorityPrimary) {
            isNamePriorityPrimary = true;
            prioritySwitchBtn.querySelector('span:nth-child(2)').textContent = "Name Priority First";
        } else if (columnKey === "Class Date" && isNamePriorityPrimary) {
            isNamePriorityPrimary = false;
            prioritySwitchBtn.querySelector('span:nth-child(2)').textContent = "Date Priority First";
        }
        sortMasterData();
        renderMasterTableUI();
    }

    function getExcelColumnLetterLabel(index) {
        let label = '';
        while (index >= 0) {
            label = String.fromCharCode((index % 26) + 65) + label;
            index = Math.floor(index / 26) - 1;
        }
        return label;
    }

    function renderMasterTableUI() {
        tableHeaders.innerHTML = '';
        tableHeaderLetters.innerHTML = '';
        tableBody.innerHTML = '';

        const emptyTh = document.createElement('th');
        emptyTh.style.width = "50px";
        tableHeaderLetters.appendChild(emptyTh);

        MASTER_HEADERS.forEach((h, index) => {
            const letterTh = document.createElement('th');
            letterTh.textContent = getExcelColumnLetterLabel(index);
            letterTh.className = "excel-row-header";
            
            letterTh.addEventListener('click', (e) => {
                if (isRankLocked) return;
                activeContextColumnHeaderKey = h;
                columnContextMenu.style.left = `${e.clientX}px`;
                columnContextMenu.style.top = `${e.clientY}px`;
                columnContextMenu.style.display = "block";
                contextMask.style.display = "block";
            });
            tableHeaderLetters.appendChild(letterTh);
        });

        const cornerTh = document.createElement('th');
        cornerTh.className = "excel-row-header";
        tableHeaders.appendChild(cornerTh);

        MASTER_HEADERS.forEach((h, index) => {
            const th = document.createElement('th');
            th.style.verticalAlign = "middle";
            
            if (isDragReorderModeActive && !isRankLocked) {
                th.className = "sortable draggable-header";
                th.setAttribute('draggable', 'true');
                
                th.addEventListener('dragstart', (e) => { 
                    draggedColumnHeaderIndex = index; 
                });
                th.addEventListener('dragover', (e) => { 
                    e.preventDefault();
                    th.classList.add('drag-over-active');
                });
                th.addEventListener('dragleave', () => {
                    th.classList.remove('drag-over-active');
                });
                th.addEventListener('drop', (e) => {
                    e.preventDefault();
                    th.classList.remove('drag-over-active');
                    if (draggedColumnHeaderIndex !== null && draggedColumnHeaderIndex !== index) {
                        const targetItem = MASTER_HEADERS.splice(draggedColumnHeaderIndex, 1)[0];
                        MASTER_HEADERS.splice(index, 0, targetItem);
                        renderMasterTableUI();
                    }
                });
            }

            if (h === "Participant Name" || h === "Class Date") {
                if (!isDragReorderModeActive) th.className = "sortable";
                
                const textSpan = document.createElement('span');
                textSpan.style.cursor = isRankLocked ? "not-allowed" : "pointer";
                textSpan.style.fontSize = "1rem";
                
                let rankLabel = isNamePriorityPrimary ? (h === "Participant Name" ? " (Primary)" : " (Secondary)") : (h === "Class Date" ? " (Primary)" : " (Secondary)");
                let isActiveDirection = h === "Participant Name" ? nameSortRule.value : dateSortRule.value;
                
                textSpan.textContent = h + rankLabel;
                textSpan.onclick = (e) => { e.stopPropagation(); setPrimaryRankFromHeaderClick(h); };
                th.appendChild(textSpan);

                const arrowIndicator = document.createElement('div');
                arrowIndicator.className = `css-arrow-icon ${isActiveDirection === 'asc' ? 'arrow-up' : 'arrow-down'}`;
                if (isRankLocked) arrowIndicator.classList.add('is-disabled');
                
                arrowIndicator.onclick = (e) => { 
                    e.stopPropagation(); 
                    if (!isRankLocked) flipDirectionOnly(h); 
                };
                th.appendChild(arrowIndicator);
            } else {
                th.textContent = h;
            }
            th.style.borderBottom = "1px solid var(--gray-300)";
            tableHeaders.appendChild(th);
        });
        const valName = filterName.value.toLowerCase().trim();
        const valCode = filterCode.value.toLowerCase().trim();
        const dateStartObj = parseCustomDate(filterDateStart.value.trim());
        const dateEndObj = parseCustomDate(filterDateEnd.value.trim());
        const valStarted = filterStartedTime.value.toLowerCase().trim();
        const valJoined = filterJoinedTime.value.toLowerCase().trim();
        const valStopped = filterStoppedTime.value.toLowerCase().trim();

        const filteredData = masterData.filter(row => {
            if (valName && !String(row["Participant Name"] || "").toLowerCase().includes(valName)) return false;
            if (valCode && !String(row["Meeting code"] || "").toLowerCase().includes(valCode)) return false;
            if (valStarted && !String(row["Attendance Started at"] || "").toLowerCase().includes(valStarted)) return false;
            if (valJoined && !String(row["Joined at(beta)"] || "").toLowerCase().includes(valJoined)) return false;
            if (valStopped && !String(row["Attendance Stopped at"] || "").toLowerCase().includes(valStopped)) return false;
            
            if (filterDateStart.value.trim() || filterDateEnd.value.trim()) {
                const rowDate = parseCustomDate(row["Class Date"]);
                if (filterDateStart.value.trim()) {
                    if (isStartDateInclusive && rowDate < dateStartObj) return false;
                    if (!isStartDateInclusive && rowDate <= dateStartObj) return false;
                }
                if (filterDateEnd.value.trim()) {
                    if (isEndDateInclusive && rowDate > dateEndObj) return false;
                    if (!isEndDateInclusive && rowDate >= dateEndObj) return false;
                }
            }
            return true;
        });

        filteredData.forEach((row, dataIndex) => {
            const tr = document.createElement('tr');
            
            if (row._isDuplicateOverlap) {
                tr.classList.add('duplicate-row-indicator');
            }

            const rowNumTd = document.createElement('td');
            rowNumTd.className = "excel-row-header";
            rowNumTd.textContent = dataIndex + 1;
            
            rowNumTd.addEventListener('click', (e) => {
                activeContextRowDataIndex = masterData.indexOf(row);
                rowContextMenu.style.left = `${e.clientX}px`;
                rowContextMenu.style.top = `${e.clientY}px`;
                rowContextMenu.style.display = "block";
                contextMask.style.display = "block";
            });
            tr.appendChild(rowNumTd);

            MASTER_HEADERS.forEach(headerKey => {
                const td = document.createElement('td');
                
                if (headerKey === "Participant Name" && row._isDuplicateOverlap) {
                    td.innerHTML = `<span>${row[headerKey] || ""}</span><span class="audit-badge" title="Exact overlap matrix match found">⚠️ alert</span>`;
                    
                    const actionBtn = document.createElement('button');
                    actionBtn.className = 'audit-action-btn';
                    actionBtn.style.marginLeft = '10px';
                    actionBtn.textContent = 'Ignore';
                    actionBtn.onclick = (e) => {
                        e.stopPropagation();
                        const currentHash = generateRowFingerprint(row);
                        ignoredAuditHashes.add(currentHash);
                        runAuditEngine();
                        renderMasterTableUI();
                    };
                    td.appendChild(actionBtn);
                } else {
                    td.textContent = row[headerKey] || "";
                }

                if (!SYSTEM_PROTECTED_HEADERS.includes(headerKey) || headerKey === "Participant Name" || headerKey === "Meeting code" || headerKey === "Class Date") {
                    td.contentEditable = "true";
                    td.className = "cell-editable";
                    td.addEventListener('blur', () => {
                        row[headerKey] = td.innerText.replace('⚠️ alertIgnore', '').trim();
                        runAuditEngine();
                        renderMasterTableUI();
                    });
                }
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }

    reAuditBtn.addEventListener('click', () => {
        ignoredAuditHashes.clear();
        runAuditEngine();
        renderMasterTableUI();
    });

    [filterName, filterCode, filterDateStart, filterDateEnd, filterStartedTime, filterJoinedTime, filterStoppedTime].forEach(el => {
        el.addEventListener('input', renderMasterTableUI);
    });

    nameSortRule.addEventListener('change', () => { sortMasterData(); renderMasterTableUI(); });
    dateSortRule.addEventListener('change', () => { sortMasterData(); renderMasterTableUI(); });

    startDateToggle.addEventListener('click', () => {
        isStartDateInclusive = !isStartDateInclusive;
        startDateToggle.textContent = isStartDateInclusive ? "Inc" : "Exc";
        renderMasterTableUI();
    });
    endDateToggle.addEventListener('click', () => {
        isEndDateInclusive = !isEndDateInclusive;
        endDateToggle.textContent = isEndDateInclusive ? "Inc" : "Exc";
        renderMasterTableUI();
    });

    timeConvertBtn.addEventListener('click', () => {
        use24HourFormat = !use24HourFormat;
        masterData.forEach(row => {
            ["Attendance Started at", "Joined at(beta)", "Attendance Stopped at"].forEach(key => {
                if (row[key]) row[key] = toggleTimeStringFormat(row[key], use24HourFormat);
            });
        });
        renderMasterTableUI();
    });

    function toggleTimeStringFormat(timeStr, to24) {
        let timePart = timeStr.match(/(\d{1,2}):(\d{2}):(\d{2})(?:\s*(AM|PM))?/i);
        if (!timePart) return timeStr;
        
        let hrs = parseInt(timePart[1]);
        let mins = timePart[2];
        let secs = timePart[3];
        let ampm = timePart[4];
        
        if (to24) {
            if (ampm) {
                if (ampm.toUpperCase() === "PM" && hrs < 12) hrs += 12;
                if (ampm.toUpperCase() === "AM" && hrs === 12) hrs = 0;
            }
            let strHrs = String(hrs).padStart(2, '0');
            return timeStr.replace(timePart[0], `${strHrs}:${mins}:${secs}`);
        } else {
            if (!ampm) {
                let suffix = hrs >= 12 ? " PM" : " AM";
                if (hrs > 12) hrs -= 12;
                if (hrs === 0) hrs = 12;
                return timeStr.replace(timePart[0], `${hrs}:${mins}:${secs}${suffix}`);
            }
            return timeStr;
        }
    }

    resetFiltersBtn.addEventListener('click', () => {
        [filterName, filterCode, filterDateStart, filterDateEnd, filterStartedTime, filterJoinedTime, filterStoppedTime].forEach(el => el.value = '');
        isStartDateInclusive = true;
        isEndDateInclusive = true;
        startDateToggle.textContent = "Inc";
        endDateToggle.textContent = "Inc";
        renderMasterTableUI();
    });

    toggleReorderBtn.addEventListener('click', () => {
        if (isRankLocked) return;
        isDragReorderModeActive = !isDragReorderModeActive;
        toggleReorderBtn.textContent = isDragReorderModeActive ? "Disable Drag Reorder Mode" : "Enable Drag Reorder Mode";
        renderMasterTableUI();
    });

    contextMask.addEventListener('click', hideContextMenus);
    function hideContextMenus() {
        columnContextMenu.style.display = "none";
        rowContextMenu.style.display = "none";
        contextMask.style.display = "none";
    }

    document.getElementById('ctx-insert-col-left').addEventListener('click', () => {
        if (!activeContextColumnHeaderKey) return;
        const idx = MASTER_HEADERS.indexOf(activeContextColumnHeaderKey);
        const newKey = "Custom_Col_" + Date.now();
        MASTER_HEADERS.splice(idx, 0, newKey);
        hideContextMenus();
        renderMasterTableUI();
    });

    document.getElementById('ctx-delete-col').addEventListener('click', () => {
        if (!activeContextColumnHeaderKey) return;
        if (SYSTEM_PROTECTED_HEADERS.includes(activeContextColumnHeaderKey)) {
            alert("System base headers are protected from being deleted.");
            hideContextMenus();
            return;
        }
        const idx = MASTER_HEADERS.indexOf(activeContextColumnHeaderKey);
        MASTER_HEADERS.splice(idx, 1);
        hideContextMenus();
        renderMasterTableUI();
    });

    document.getElementById('ctx-insert-row-above').addEventListener('click', () => {
        if (activeContextRowDataIndex === null) return;
        const newRow = {};
        MASTER_HEADERS.forEach(h => newRow[h] = "");
        masterData.splice(activeContextRowDataIndex, 0, newRow);
        normalizeAndInitializeData();
        hideContextMenus();
    });

    document.getElementById('ctx-delete-row').addEventListener('click', () => {
        if (activeContextRowDataIndex === null) return;
        masterData.splice(activeContextRowDataIndex, 1);
        normalizeAndInitializeData();
        hideContextMenus();
    });

    downloadBtn.addEventListener('click', () => {
        if (masterData.length === 0) return;
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += MASTER_HEADERS.map(h => `"${h}"`).join(",") + "\n";
        
        masterData.forEach(row => {
            const line = MASTER_HEADERS.map(h => {
                const cellValue = String(row[h] || "").replace(/"/g, '""');
                return `"${cellValue}"`;
            }).join(",");
            csvContent += line + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Merged_Attendance_Matrix.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>
</body>

<script>
    let MASTER_HEADERS = [
        "SNo", "Participant Name", "Attendance Started at", 
        "Joined at(beta)", "Attendance Stopped at", "Attended Duration", "Meeting code", "Class Date"
    ];
    const SYSTEM_PROTECTED_HEADERS = [...MASTER_HEADERS];
    
    let uploadedFilesArray = [];
    let masterData = [];
    let isRankLocked = false;
    let isNamePriorityPrimary = true;
    let isStartDateInclusive = true;
    let isEndDateInclusive = true;
    
    let currentActiveTimeMode = "12h";

    let isDragReorderModeActive = false;
    let draggedColumnHeaderIndex = null;
    let activeContextColumnHeaderKey = null;
    let activeContextRowDataIndex = null;

    const csvPicker = document.getElementById('csv-picker');
    const uploadSection = document.querySelector('.upload-section');
    const fileQueue = document.getElementById('file-queue');
    const nextBtn = document.getElementById('next-btn');
    const backBtn = document.getElementById('back-btn');
    const downloadBtn = document.getElementById('download-btn');
    const timeConvertBtn = document.getElementById('time-convert-btn');
    const resetFiltersBtn = document.getElementById('reset-filters-btn');
    const toggleReorderBtn = document.getElementById('toggle-reorder-btn');
    
    const nameSortRule = document.getElementById('name-sort-rule');
    const dateSortRule = document.getElementById('date-sort-rule');
    const prioritySwitchBtn = document.getElementById('priority-switch-btn');
    const rankLockBtn = document.getElementById('rank-lock-btn');
    
    const filterName = document.getElementById('filter-name');
    const filterCode = document.getElementById('filter-code');
    const filterDurMin = document.getElementById('filter-dur-min');
    const filterDurMax = document.getElementById('filter-dur-max');
    const filterDateStart = document.getElementById('filter-date-start');
    const filterDateEnd = document.getElementById('filter-date-end');
    const startDateToggle = document.getElementById('start-date-toggle');
    const endDateToggle = document.getElementById('end-date-toggle');
    
    const filterStartedTime = document.getElementById('filter-started-time');
    const filterJoinedTime = document.getElementById('filter-joined-time');
    const filterStoppedTime = document.getElementById('filter-stopped-time');
    
    const stage1 = document.getElementById('stage-1');
    const stage2 = document.getElementById('stage-2');
    
    const tableHeaders = document.getElementById('table-headers');
    const tableHeaderLetters = document.getElementById('table-header-letters');
    const tableBody = document.getElementById('table-body');
    
    const contextMask = document.getElementById('context-mask');
    const columnContextMenu = document.getElementById('column-context-menu');
    const rowContextMenu = document.getElementById('row-context-menu');

    function handleFileSelection(files) {
        if (!files) return;
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.name.toLowerCase().endsWith('.csv')) {
                if (!uploadedFilesArray.some(f => f.name === file.name)) {
                    uploadedFilesArray.push(file);
                }
            }
        }
        renderQueueUI();
    }

    csvPicker.addEventListener('change', (e) => {
        handleFileSelection(e.target.files);
        csvPicker.value = ""; 
    });

    uploadSection.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        uploadSection.style.borderColor = 'var(--primary)';
        uploadSection.style.background = '#eff6ff'; 
    });

    uploadSection.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        uploadSection.style.borderColor = 'var(--gray-300)';
        uploadSection.style.background = 'white';
    });

    uploadSection.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        uploadSection.style.borderColor = 'var(--gray-300)';
        uploadSection.style.background = 'white';
        if (e.dataTransfer && e.dataTransfer.files) {
            handleFileSelection(e.dataTransfer.files);
        }
    });

    function renderQueueUI() {
        fileQueue.innerHTML = '';
        if (uploadedFilesArray.length === 0) {
            fileQueue.innerHTML = '<p style="color: #9ca3af; font-style: italic;">No files selected yet.</p>';
            return;
        }
        uploadedFilesArray.forEach((file, index) => {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'file-name';
            nameSpan.textContent = file.name;
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.innerHTML = '&times;';
            removeBtn.onclick = (e) => {
                e.stopPropagation(); 
                uploadedFilesArray.splice(index, 1);
                renderQueueUI();
            };
            
            fileItem.appendChild(nameSpan);
            fileItem.appendChild(removeBtn);
            fileQueue.appendChild(fileItem);
        });
    }

    function extractDateFromFilename(filename) {
        const match = filename.match(/\(([^)]+)\)/);
        if (!match || !match) return "Unknown Date";
        
        let rawDate = match.trim(); 
        rawDate = rawDate.replace(/\./g, '');
        
        const parts = rawDate.split('-');
        if (parts.length !== 3) return rawDate; 
        
        let day = parts.trim();
        let month = parts.trim();
        let year = parts.trim();
        
        month = month.substring(0, 3);
        month = month.charAt(0).toUpperCase() + month.slice(1).toLowerCase();

        return `${day}-${month}-${year}`;
    }

    function parseCSVLine(text) {
        let p = '', r = [];
        let q = false;
        const cleanText = text.replace(/\r$/, '');
        for (let i = 0; i < cleanText.length; i++) {
            let c = cleanText[i];
            if (c === '"') { q = !q; }
            else if (c === ',' && !q) { r.push(p.trim()); p = ''; }
            else { p += c; }
        }
        r.push(p.trim());
        return r;
    }

    function parseCustomDate(dateStr) {
        if (!dateStr || dateStr === "Unknown Date") return new Date(0);
        let cleanStr = dateStr.replace(/\./g, '').toLowerCase();
        const parts = cleanStr.split('-');
        if (parts.length !== 3) return new Date(0);
        
        const day = parseInt(parts, 10);
        const monthStr = parts.substring(0, 3);
        const year = parseInt(parts, 10);
        
        const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
        const monthIndex = months.indexOf(monthStr);
        
        return monthIndex !== -1 ? new Date(year, monthIndex, day) : new Date(0);
    }

    function parseDurationToMinutes(durStr) {
        if (!durStr) return 0;
        let clean = durStr.toLowerCase().replace(/[^0-9\shm]/g, '').trim();
        if (!clean) return 0;
        
        if (clean.includes('h') || clean.includes('m')) {
            let totalMin = 0;
            const hrMatch = clean.match(/(\d+)\s*h/);
            const minMatch = clean.match(/(\d+)\s*m/);
            if (hrMatch) totalMin += parseInt(hrMatch, 10) * 60;
            if (minMatch) totalMin += parseInt(minMatch, 10);
            return totalMin;
        }
        
        let parsed = parseInt(clean, 10);
        return isNaN(parsed) ? 0 : parsed;
    }

    function convertTimeStringSyntax(timeStr) {
        if (!timeStr) return "";
        let clean = timeStr.trim().toUpperCase();
        
        const ampmMatch = clean.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)$/);
        if (ampmMatch) {
            let hrs = parseInt(ampmMatch, 10);
            let mins = ampmMatch;
            let secs = ampmMatch ? `:${ampmMatch}` : "";
            let period = ampmMatch;
            
            if (period === "PM" && hrs < 12) hrs += 12;
            if (period === "AM" && hrs === 12) hrs = 0;
            return `${String(hrs).padStart(2, '0')}:${mins}${secs}`;
        }
        
        const militaryMatch = clean.match(/^(\d{2}):(\d{2})(?::(\d{2}))?$/);
        if (militaryMatch) {
            let hrs = parseInt(militaryMatch, 10);
            let mins = militaryMatch;
            let secs = militaryMatch ? `:${militaryMatch}` : "";
            let period = "AM";
            
            if (hrs >= 12) { period = "PM"; if (hrs > 12) hrs -= 12; }
            if (hrs === 0) hrs = 12;
            return `${hrs}:${mins}${secs} ${period}`;
        }
        return timeStr; 
    }

        nextBtn.addEventListener('click', async () => {
        if (uploadedFilesArray.length === 0) {
            alert('Please upload or drag-and-drop at least one CSV file.');
            return;
        }

        masterData = []; 

        for (let file of uploadedFilesArray) {
            try {
                const text = await file.text();
                const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
                if (lines.length === 0) continue;

                const fileHeaders = parseCSVLine(lines); 
                const fileDate = extractDateFromFilename(file.name);
                
                const indexMap = {};
                MASTER_HEADERS.forEach(header => {
                    indexMap[header] = fileHeaders.findIndex(fh => fh.toLowerCase() === header.toLowerCase());
                });

                for (let i = 1; i < lines.length; i++) {
                    const rowValues = parseCSVLine(lines[i]);
                    if (rowValues.length === 0 || rowValues.every(val => val === '')) continue;

                    let structuredObj = {};
                    MASTER_HEADERS.forEach(header => {
                        if (header === "Class Date") {
                            structuredObj[header] = fileDate;
                        } else {
                            const mappedIdx = indexMap[header];
                            structuredObj[header] = (mappedIdx !== -1 && mappedIdx < rowValues.length) ? rowValues[mappedIdx] : '';
                        }
                    });
                    masterData.push(structuredObj);
                }
            } catch (err) {
                console.error("Error reading file: " + file.name, err);
            }
        }

        sortMasterData();
        renderMasterTableUI();
        stage1.classList.remove('active');
        stage2.classList.add('active');
    });

    backBtn.addEventListener('click', () => {
        stage1.classList.add('active');
        stage2.classList.remove('active');
    });

    toggleReorderBtn.addEventListener('click', () => {
        if (isRankLocked) return;
        isDragReorderModeActive = !isDragReorderModeActive;
        toggleReorderBtn.textContent = isDragReorderModeActive ? "Disable Drag Reorder Mode" : "Enable Drag Reorder Mode";
        toggleReorderBtn.style.background = isDragReorderModeActive ? "#dc2626" : "var(--excel-green)";
        toggleReorderBtn.style.borderColor = isDragReorderModeActive ? "#dc2626" : "var(--excel-green)";
        renderMasterTableUI();
    });

    resetFiltersBtn.addEventListener('click', () => {
        [filterName, filterCode, filterDurMin, filterDurMax, filterDateStart, filterDateEnd, filterStartedTime, filterJoinedTime, filterStoppedTime].forEach(f => f.value = "");
        isStartDateInclusive = true;
        isEndDateInclusive = true;
        startDateToggle.textContent = "Inc";
        endDateToggle.textContent = "Inc";
        renderMasterTableUI();
    });

    function closeAllContextMenus() {
        columnContextMenu.style.display = "none";
        rowContextMenu.style.display = "none";
        contextMask.style.display = "none";
    }
    contextMask.addEventListener('click', closeAllContextMenus);

    document.getElementById('ctx-insert-col-left').addEventListener('click', () => {
        if (isRankLocked || !activeContextColumnHeaderKey) return;
        const newColName = prompt("Enter a unique name for your new custom column:");
        if (!newColName) return;
        const cleanCol = newColName.trim();
        if (cleanCol === "" || MASTER_HEADERS.includes(cleanCol)) { alert("Duplicate column name."); return; }
        
        const idx = MASTER_HEADERS.indexOf(activeContextColumnHeaderKey);
        if (idx !== -1) {
            MASTER_HEADERS.splice(idx, 0, cleanCol);
            masterData.forEach(row => { row[cleanCol] = ""; });
        }
        closeAllContextMenus();
        renderMasterTableUI();
    });

    document.getElementById('ctx-delete-col').addEventListener('click', () => {
        if (isRankLocked || !activeContextColumnHeaderKey) return;
        if (SYSTEM_PROTECTED_HEADERS.includes(activeContextColumnHeaderKey)) {
            alert("Protected base headers cannot be deleted.");
            return;
        }
        const idx = MASTER_HEADERS.indexOf(activeContextColumnHeaderKey);
        if (idx !== -1) {
            MASTER_HEADERS.splice(idx, 1);
            masterData.forEach(row => { delete row[activeContextColumnHeaderKey]; });
        }
        closeAllContextMenus();
        renderMasterTableUI();
    });

    document.getElementById('ctx-insert-row-above').addEventListener('click', () => {
        if (isRankLocked || activeContextRowDataIndex === null) return;
        let blankRow = {};
        MASTER_HEADERS.forEach(h => { blankRow[h] = ""; });
        masterData.splice(activeContextRowDataIndex, 0, blankRow);
        closeAllContextMenus();
        renderMasterTableUI();
    });

    document.getElementById('ctx-delete-row').addEventListener('click', () => {
        if (isRankLocked || activeContextRowDataIndex === null) return;
        masterData.splice(activeContextRowDataIndex, 1);
        closeAllContextMenus();
        renderMasterTableUI();
    });

    [nameSortRule, dateSortRule].forEach(select => {
        select.addEventListener('change', () => { sortMasterData(); renderMasterTableUI(); });
    });

    [filterName, filterCode, filterDurMin, filterDurMax, filterDateStart, filterDateEnd, filterStartedTime, filterJoinedTime, filterStoppedTime].forEach(input => {
        input.addEventListener('input', () => { renderMasterTableUI(); });
    });

    startDateToggle.addEventListener('click', () => {
        isStartDateInclusive = !isStartDateInclusive;
        startDateToggle.textContent = isStartDateInclusive ? "Inc" : "Exc";
        renderMasterTableUI();
    });
    endDateToggle.addEventListener('click', () => {
        isEndDateInclusive = !isEndDateInclusive;
        endDateToggle.textContent = isEndDateInclusive ? "Inc" : "Exc";
        renderMasterTableUI();
    });

    timeConvertBtn.addEventListener('click', () => {
        currentActiveTimeMode = (currentActiveTimeMode === "12h") ? "24h" : "12h";
        
        const lbl12 = document.getElementById('label-12h');
        const lbl24 = document.getElementById('label-24h');
        if (currentActiveTimeMode === "12h") {
            lbl12.className = "time-mode-label is-active";
            lbl24.className = "time-mode-label";
        } else {
            lbl12.className = "time-mode-label";
            lbl24.className = "time-mode-label is-active";
        }
        
        masterData.forEach(row => {
            ["Attendance Started at", "Joined at(beta)", "Attendance Stopped at"].forEach(header => {
                if (row[header]) row[header] = convertTimeStringSyntax(row[header]);
            });
        });
        renderMasterTableUI(); 
    });

    prioritySwitchBtn.addEventListener('click', () => {
        if (isRankLocked) return;
        isNamePriorityPrimary = !isNamePriorityPrimary;
        prioritySwitchBtn.textContent = isNamePriorityPrimary ? "Name Priority First ⇄" : "Date Priority First ⇄";
        sortMasterData();
        renderMasterTableUI();
    });

    rankLockBtn.addEventListener('click', () => {
        isRankLocked = !isRankLocked;
        if (isRankLocked) {
            rankLockBtn.className = "lock-container is-locked";
            nameSortRule.disabled = true;
            dateSortRule.disabled = true;
            prioritySwitchBtn.disabled = true;
            toggleReorderBtn.disabled = true;
            isDragReorderModeActive = false;
            toggleReorderBtn.textContent = "Enable Drag Reorder Mode";
            toggleReorderBtn.style.background = "var(--excel-green)";
        } else {
            rankLockBtn.className = "lock-container is-unlocked";
            nameSortRule.disabled = false;
            dateSortRule.disabled = false;
            prioritySwitchBtn.disabled = false;
            toggleReorderBtn.disabled = false;
        }
        renderMasterTableUI();
    });

    function sortMasterData() {
        const nameDirection = nameSortRule.value === 'asc' ? 1 : -1;
        const dateDirection = dateSortRule.value === 'asc' ? 1 : -1;

        function checkNameLayer(a, b) {
            const nameA = (a["Participant Name"] || "").toLowerCase();
            const nameB = (b["Participant Name"] || "").toLowerCase();
            return nameA.localeCompare(nameB) * nameDirection;
        }

        function checkDateLayer(a, b) {
            const dateA = parseCustomDate(a["Class Date"]);
            const dateB = parseCustomDate(b["Class Date"]);
            return (dateA - dateB) * dateDirection;
        }

        masterData.sort((a, b) => {
            if (isNamePriorityPrimary) {
                const res = checkNameLayer(a, b);
                if (res !== 0) return res;
                return checkDateLayer(a, b);
            } else {
                const res = checkDateLayer(a, b);
                if (res !== 0) return res;
                return checkNameLayer(a, b);
            }
        });
    }

    function flipDirectionOnly(columnKey) {
        if (isRankLocked) return;
        if (columnKey === "Participant Name") {
            nameSortRule.value = (nameSortRule.value === 'asc') ? 'desc' : 'asc';
        } else if (columnKey === "Class Date") {
            dateSortRule.value = (dateSortRule.value === 'asc') ? 'desc' : 'asc';
        }
        sortMasterData();
        renderMasterTableUI();
    }

    function setPrimaryRankFromHeaderClick(columnKey) {
        if (isRankLocked || isDragReorderModeActive) return;
        if (columnKey === "Participant Name" && !isNamePriorityPrimary) {
            isNamePriorityPrimary = true;
            prioritySwitchBtn.textContent = "Name Priority First ⇄";
        } else if (columnKey === "Class Date" && isNamePriorityPrimary) {
            isNamePriorityPrimary = false;
            prioritySwitchBtn.textContent = "Date Priority First ⇄";
        }
        sortMasterData();
        renderMasterTableUI();
    }

    function getExcelColumnLetterLabel(index) {
        let label = '';
        while (index >= 0) {
            label = String.fromCharCode((index % 26) + 65) + label;
            index = Math.floor(index / 26) - 1;
        }
        return label;
    }

    function renderMasterTableUI() {
        tableHeaders.innerHTML = '';
        tableHeaderLetters.innerHTML = '';
        tableBody.innerHTML = '';

        const emptyTh = document.createElement('th');
        emptyTh.style.width = "50px";
        tableHeaderLetters.appendChild(emptyTh);

        MASTER_HEADERS.forEach((h, index) => {
            const letterTh = document.createElement('th');
            letterTh.textContent = getExcelColumnLetterLabel(index);
            letterTh.className = "excel-row-header";
            
            letterTh.addEventListener('click', (e) => {
                if (isRankLocked) return;
                activeContextColumnHeaderKey = h;
                columnContextMenu.style.left = `${e.clientX}px`;
                columnContextMenu.style.top = `${e.clientY}px`;
                columnContextMenu.style.display = "block";
                contextMask.style.display = "block";
            });
            tableHeaderLetters.appendChild(letterTh);
        });

        const cornerTh = document.createElement('th');
        cornerTh.className = "excel-row-header";
        tableHeaders.appendChild(cornerTh);

        MASTER_HEADERS.forEach((h, index) => {
            const th = document.createElement('th');
            th.style.verticalAlign = "middle";
            
            if (isDragReorderModeActive && !isRankLocked) {
                th.className = "sortable draggable-header";
                th.setAttribute('draggable', 'true');
                
                th.addEventListener('dragstart', (e) => { draggedColumnHeaderIndex = index; });
                th.addEventListener('dragover', (e) => { e.preventDefault(); });
                th.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedColumnHeaderIndex !== null && draggedColumnHeaderIndex !== index) {
                        const tempTargetItem = MASTER_HEADERS[draggedColumnHeaderIndex];
                        MASTER_HEADERS.splice(draggedColumnHeaderIndex, 1);
                        MASTER_HEADERS.splice(index, 0, tempTargetItem);
                        renderMasterTableUI();
                    }
                });
            }

            if (h === "Participant Name" || h === "Class Date") {
                if (!isDragReorderModeActive) th.className = "sortable";
                
                const textSpan = document.createElement('span');
                textSpan.style.cursor = isRankLocked ? "not-allowed" : "pointer";
                textSpan.style.fontSize = "1rem";
                
                if (!isRankLocked && !isDragReorderModeActive) {
                    textSpan.onmouseover = () => textSpan.style.color = "var(--primary)";
                    textSpan.onmouseout = () => textSpan.style.color = "";
                }
                
                let rankLabel = isNamePriorityPrimary ? (h === "Participant Name" ? " (Primary)" : " (Secondary)") : (h === "Class Date" ? " (Primary)" : " (Secondary)");
                let isActiveDirection = h === "Participant Name" ? nameSortRule.value : dateSortRule.value;
                
                textSpan.textContent = h + rankLabel;
                textSpan.onclick = (e) => { e.stopPropagation(); setPrimaryRankFromHeaderClick(h); };
                th.appendChild(textSpan);

                const arrowIndicator = document.createElement('div');
                arrowIndicator.className = `css-arrow-icon ${isActiveDirection === 'asc' ? 'arrow-up' : 'arrow-down'}`;
                if (isRankLocked) arrowIndicator.classList.add('is-disabled');
                
                arrowIndicator.onclick = (e) => { 
                    e.stopPropagation(); 
                    if (!isRankLocked) flipDirectionOnly(h); 
                };
                th.appendChild(arrowIndicator);
            } else {
                th.textContent = h;
            }
            th.style.borderBottom = "1px solid var(--gray-300)";
            tableHeaders.appendChild(th);
        });

        const valName = filterName.value.toLowerCase().trim();
        const valCode = filterCode.value.toLowerCase().trim();
        const valMinDur = parseFloat(filterDurMin.value);
        const valMaxDur = parseFloat(filterDurMax.value);
        const dateStartObj = parseCustomDate(filterDateStart.value.trim());
        const dateEndObj = parseCustomDate(filterDateEnd.value.trim());
        const valStarted = filterStartedTime.value.toLowerCase().trim();
        const valJoined = filterJoinedTime.value.toLowerCase().trim();
        const valStopped = filterStoppedTime.value.toLowerCase().trim();

        const filteredData = masterData.filter(row => {
            if (valName && !String(row["Participant Name"] || "").toLowerCase().includes(valName)) return false;
            if (valCode && !String(row["Meeting code"] || "").toLowerCase().includes(valCode)) return false;
            if (valStarted && !String(row["Attendance Started at"] || "").toLowerCase().includes(valStarted)) return false;
            if (valJoined && !String(row["Joined at(beta)"] || "").toLowerCase().includes(valJoined)) return false;
            if (valStopped && !String(row["Attendance Stopped at"] || "").toLowerCase().includes(valStopped)) return false;
            
            if (!isNaN(valMinDur) || !isNaN(valMaxDur)) {
                const totalMins = parseDurationToMinutes(row["Attended Duration"]);
                if (!isNaN(valMinDur) && totalMins < valMinDur) return false;
                if (!isNaN(valMaxDur) && totalMins > valMaxDur) return false;
            }
            if (filterDateStart.value.trim() || filterDateEnd.value.trim()) {
                const targetDateObj = parseCustomDate(row["Class Date"]);
                if (filterDateStart.value.trim()) {
                    if (isStartDateInclusive && targetDateObj < dateStartObj) return false;
                    if (!isStartDateInclusive && targetDateObj <= dateStartObj) return false;
                }
                if (filterDateEnd.value.trim()) {
                    if (isEndDateInclusive && targetDateObj > dateEndObj) return false;
                    if (!isEndDateInclusive && targetDateObj >= dateEndObj) return false;
                }
            }
            return true;
        });

        tableBody.innerHTML = '';
        filteredData.forEach((row, index) => {
            const tr = document.createElement('tr');
            
            const indexTd = document.createElement('td');
            indexTd.textContent = index + 1;
            indexTd.className = "excel-row-header";
            
            indexTd.addEventListener('click', (e) => {
                if (isRankLocked) return;
                activeContextRowDataIndex = masterData.indexOf(row);
                rowContextMenu.style.left = `${e.clientX}px`;
                rowContextMenu.style.top = `${e.clientY}px`;
                rowContextMenu.style.display = "block";
                contextMask.style.display = "block";
            });
            tr.appendChild(indexTd);

            MASTER_HEADERS.forEach(header => {
                const td = document.createElement('td');
                const input = document.createElement('input');
                
                input.value = row[header] || '';
                const baseIndex = masterData.indexOf(row);
                
                input.addEventListener('input', (e) => {
                    if (baseIndex !== -1) masterData[baseIndex][header] = e.target.value.trim();
                });
                
                td.style.borderBottom = "1px solid var(--gray-300)";
                td.appendChild(input);
                tr.appendChild(td);
            });
            tableBody.appendChild(tr);
        });
    }

    downloadBtn.addEventListener('click', () => {
        if (masterData.length === 0) return;

        let csvContent = MASTER_HEADERS.join(",") + "\n";
        const dynamicSpacer = ",".repeat(MASTER_HEADERS.length - 1);
        csvContent += dynamicSpacer + "\n";
        
        masterData.forEach(row => {
            let rowLine = MASTER_HEADERS.map(header => {
                let cellValue = row[header] || '';
                if (cellValue.includes(',') || cellValue.includes('"')) {
                    cellValue = `"${cellValue.replace(/"/g, '""')}"`;
                }
                return cellValue;
            }).join(",");
            csvContent += rowLine + "\n";
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "combined_attendance_report.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
